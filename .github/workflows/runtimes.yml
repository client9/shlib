name: runtimes

# Container images routinely ship a language runtime and no downloader at all.
# These legs pin the two branches of last resort in http_download.
#
# Both images deliberately install ONLY make, and both assert that curl, wget,
# fetch and ftp are absent before testing.  Here the absence is the thing under
# test: if a dependency ever pulls curl in, the suite quietly stops exercising
# the branch and nothing goes red.

on:
  push:
    branches: [master]
  pull_request:
  # this repo goes quiet for long stretches; a monthly build catches bit-rot
  # in the things we do not control (release URLs, runner images)
  schedule:
    - cron: '23 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python3 as the only downloader
            image: python:3.12-slim
            check: python3 --version
          - name: node as the only downloader
            image: node:22-slim
            check: node --version
    steps:
      - uses: actions/checkout@v7
      # run under docker rather than `container:` -- actions/checkout needs a
      # normal runner image
      - name: make test
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.image }} sh -c '
            set -e
            apt-get update -qq && apt-get install -y -qq make

            for t in curl wget fetch ftp; do
              if command -v $t >/dev/null 2>&1; then
                echo "$t is present; this leg no longer tests the runtime branch" >&2
                exit 1
              fi
            done
            ${{ matrix.check }}

            make test TEST_SHELL=/bin/sh'

      # the suite proves the branch; this proves the product.  Same shape as
      # the omnios leg, which installs hugo and runs it.  No tag argument, so
      # it also exercises github_release resolving "latest" -- which needs an
      # Accept header, the one thing fetch(1) and ftp(1) cannot send and the
      # reason these branches are more than a fallback.
      - name: install a real binary with no downloader present
        run: |
          docker run --rm -v "$PWD:/src" -w /tmp ${{ matrix.image }} sh -c '
            set -e
            cat /src/install/examples/gosec.sh /src/dist/install-base.sh > install.sh
            sh install.sh -b /tmp/bin
            /tmp/bin/gosec --version'
