name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: build and publish bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: tag must match ./VERSION
        run: |
          want="v$(cat VERSION)"
          got="${{ github.ref_name }}"
          if [ "$want" != "$got" ]; then
            echo "::error::tag $got does not match ./VERSION ($want) -- bump VERSION, run 'make dist', commit, then retag"
            exit 1
          fi

      - name: install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl bzip2 xz-utils zstd zip unzip

      - name: rebuild dist/
        run: make dist

      - name: dist/ must match the committed files
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is out of date -- run 'make dist' and commit before tagging"
            exit 1
          fi

      - name: test
        run: make test

      # gh is preinstalled on the runner, so no third-party release action is
      # needed -- one less thing in the supply chain
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/shlib.sh dist/shlib.min.sh dist/install-base.sh dist/checksums.txt
