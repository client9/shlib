name: sunos

on:
  push:
    branches: [master]
  pull_request:
  # this repo goes quiet for long stretches; a monthly build catches bit-rot
  # in the things we do not control (release URLs, runner images)
  schedule:
    - cron: '17 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# Solaris and illumos both report the ancient "SunOS" from `uname -s`, and
# uname_os tells them apart with `uname -o`.  That branch has produced more
# bugs than any other mapping in this library -- a `==` bashism that silently
# fell through to solaris under any POSIX shell, and a downstream fork that
# reimplemented it with the same bug -- and until now it had only ever been
# exercised with a stubbed `uname`.  These two legs run it on the real thing.
#
# Both actions boot a QEMU VM on a Linux runner, and both execute `run` with
# sh regardless of the VM's login shell.
#
# `uses:` cannot take a matrix expression, so these are two jobs rather than
# two legs of one.
jobs:
  solaris:
    name: solaris (SunOS without illumos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: test on Solaris 11.4
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4"
          # Nothing to install: the earlier run showed curl, openssl,
          # sha256sum and tar are already present.  Avoiding a package step
          # removes a failure mode that has nothing to do with what this leg
          # tests.
          run: |
            # Diagnostics first: nothing here has been observed on a real
            # Solaris runner, only assumed.
            echo "uname -s : $(uname -s)"
            echo "uname -o : $(uname -o 2>/dev/null || echo '(unsupported)')"
            echo "uname -m : $(uname -m)"
            for c in sh gmake make curl wget fetch openssl install cp chmod \
                     sha256sum sha512sum md5sum shasum digest gtar tar; do
              printf '%-10s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
            done

            # The assertion this leg exists for.  Needs no tooling, so it runs
            # even if the package install above did not work.
            . ./echoerr.sh; . ./log.sh
            . ./uname_os.sh; . ./uname_os_check.sh
            os=$(uname_os)
            echo "uname_os -> $os"
            if [ "$os" != "solaris" ]; then
              echo "::error::expected 'solaris', got '$os'"
              exit 1
            fi
            uname_os_check || exit 1

            # Run the suite directly rather than through make: the Makefile
            # is GNU-only (.DEFAULT_GOAL, MAKEFILE_LIST) and gmake is not
            # guaranteed here.  The Makefile is only a runner.
            err=0
            for t in *_test.sh; do
              if sh "$t"; then :; else err=1; fi
            done
            exit $err

  omnios:
    name: omnios (SunOS reporting illumos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: test on OmniOS
        uses: vmactions/omnios-vm@v1
        with:
          release: "r151054"
          # see the note on the solaris job: no packages needed
          run: |
            echo "uname -s : $(uname -s)"
            echo "uname -o : $(uname -o 2>/dev/null || echo '(unsupported)')"
            echo "uname -m : $(uname -m)"
            for c in sh gmake make curl wget fetch openssl install cp chmod \
                     sha256sum sha512sum md5sum shasum digest gtar tar; do
              printf '%-10s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
            done

            . ./echoerr.sh; . ./log.sh
            . ./uname_os.sh; . ./uname_os_check.sh
            os=$(uname_os)
            echo "uname_os -> $os"
            if [ "$os" != "illumos" ]; then
              echo "::error::expected 'illumos', got '$os'"
              exit 1
            fi
            uname_os_check || exit 1

            # Run the suite directly rather than through make: the Makefile
            # is GNU-only (.DEFAULT_GOAL, MAKEFILE_LIST) and gmake is not
            # guaranteed here.  The Makefile is only a runner.
            err=0
            for t in *_test.sh; do
              if sh "$t"; then :; else err=1; fi
            done

            # The illumos mapping in install/examples/hugo.sh, proved rather
            # than argued.
            #
            # Hugo publishes solaris-amd64 and nothing for illumos, and the
            # example config maps illumos onto that build.  Whether that is
            # legitimate is a claim about the ABI, not about shell, so no
            # amount of unit testing settles it -- the only honest check is to
            # install the thing here and run it.  This is also the only leg
            # that can: illumos exists nowhere else in CI.
            #
            # Pinned to an explicit tag, not "latest": this tests the illumos
            # ABI, not hugo's release cadence, and a moving version would make
            # a failure ambiguous.  It does couple this leg to that release
            # staying downloadable, which is the price of an end-to-end check.
            #
            # Sets err= rather than exiting, so a failure here cannot hide the
            # suite result above, or the other way round.
            echo "== hugo install on illumos (proves the illumos -> solaris map) =="
            hugodir=./hugo-illumos-check
            rm -rf "$hugodir"
            mkdir -p "$hugodir"
            cat install/examples/hugo.sh dist/install-base.sh >"$hugodir/install.sh"
            if sh "$hugodir/install.sh" -b "$hugodir/bin" v0.165.0; then
              if "$hugodir/bin/hugo" version; then
                echo "hugo runs on illumos; the solaris build is compatible"
              else
                echo "::error::hugo installed but will not execute on illumos -- the illumos->solaris mapping in install/examples/hugo.sh is wrong and should be removed"
                err=1
              fi
            else
              echo "::error::the hugo installer failed on illumos"
              err=1
            fi
            rm -rf "$hugodir"

            exit $err
