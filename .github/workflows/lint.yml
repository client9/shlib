name: lint

on:
  push:
    branches: [master]
  pull_request:
  # this repo goes quiet for long stretches; a monthly build catches bit-rot
  # in the things we do not control (release URLs, runner images)
  schedule:
    - cron: '17 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck + shfmt
        run: make tools
      - run: make lint

  generated:
    name: generated files in sync with sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: rebuild dist/ and docs/
        run: make dist docs
      - name: generated files must match what is committed
        run: |
          if ! git diff --exit-code dist/ docs/API.md; then
            echo "::error::generated files are out of date -- run 'make dist docs' and commit the result"
            exit 1
          fi
