name: dragonflybsd

on:
  push:
    branches: [master]
  pull_request:
  # this repo goes quiet for long stretches; a monthly build catches bit-rot
  # in the things we do not control (release URLs, runner images).  Offset
  # from the other VM workflows so four QEMU boots do not start at once.
  schedule:
    - cron: '17 16 1 * *'
  workflow_dispatch:

permissions:
  contents: read

# DragonFly is the lowest-risk of the BSD legs and exists mostly to keep the
# GOOS mapping honest: `uname -s` reports "DragonFly", which lowercases
# straight to the GOOS `dragonfly` with no fixup, and until now nothing
# checked that on a real machine.
#
# Being FreeBSD-derived it has fetch(1), so it goes down the same http_download
# branch the freebsd leg covers rather than the ftp(1) branch OpenBSD and
# NetBSD exercise.
#
# Unlike every other BSD leg this one does NOT assert that curl is absent: the
# vmactions image ships curl in /usr/local/bin (verified in the first run's
# tool inventory), so dispatch here picks curl and the fetch branch would
# never run.  Rather than fight the image, the fetch branch is invoked
# DIRECTLY below.  That is the more robust shape anyway -- it tests the branch
# rather than testing the absence of its alternatives, which is a property of
# somebody else's disk image and can change under us.
#
# One release only: nothing about this leg is version-sensitive, and each
# leg is a QEMU boot.
jobs:
  test:
    name: ${{ matrix.release }}
    # GitHub has no DragonFly runner; vmactions boots one under QEMU on the
    # normal x86_64 Linux runner and mounts the checkout into the VM.
    #
    # Third-party action, pinned to the v1 major tag for low maintenance; pin
    # to a full commit SHA instead if you want the stricter supply-chain
    # posture.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ['6.4.2']
    steps:
      - uses: actions/checkout@v7
      - name: test on DragonFly BSD ${{ matrix.release }}
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: ${{ matrix.release }}
          # Nothing is installed.  `run` is always executed with sh whatever
          # the login shell is -- and, as the first run of this workflow
          # showed, under `set -u`.  That is why nounset_test.sh exists.
          run: |
            # Diagnostics first.  The first run of this workflow is what
            # established what is actually on the image -- notably curl, and
            # no ksh or bash -- so keep this printing.
            uname -a
            for c in sh ksh bash gmake make curl wget fetch ftp openssl \
                     install cp chmod sha256sum sha512sum md5sum shasum \
                     md5 sha256 cksum tar unzip zip zstd; do
              printf '%-10s %s\n' "$c" "$(command -v "$c" 2>/dev/null || echo MISSING)"
            done

            # Assert the premise of this leg.  curl is deliberately NOT
            # asserted absent here -- see the note at the top of this file.
            command -v fetch >/dev/null 2>&1 || { echo "::error::fetch(1) missing"; exit 1; }
            echo "downloader: $(command -v fetch)"

            # The mapping assertion runs BEFORE the suite, so a failure later
            # still leaves the result in the log.  Needs no tooling.
            . ./echoerr.sh; . ./log.sh
            . ./uname_os.sh; . ./uname_os_check.sh
            os=$(uname_os)
            echo "uname_os -> $os"
            if [ "$os" != "dragonfly" ]; then
              echo "::error::expected 'dragonfly', got '$os'"
              exit 1
            fi
            uname_os_check || exit 1

            # Exercise the fetch branch DIRECTLY, since curl is present and
            # would otherwise win dispatch.  Both forms: a plain download, and
            # one carrying the Accept header fetch maps onto HTTP_ACCEPT.
            . ./is_command.sh; . ./mktmpdir.sh
            . ./http_download.sh; . ./github_release.sh
            d=$(mktmpdir)
            echo "== http_download_fetch, no header =="
            http_download_fetch "$d/plain" \
              https://raw.githubusercontent.com/client9/shlib/master/fixtures/sample1.txt || {
              echo "::error::http_download_fetch failed on a plain download"
              exit 1
            }
            echo "got: $(cat "$d/plain")"
            echo "== http_download_fetch, Accept header via HTTP_ACCEPT =="
            http_download_fetch "$d/json" \
              https://github.com/client9/shlib/releases/latest "Accept:application/json" || {
              echo "::error::http_download_fetch failed with an Accept header"
              exit 1
            }
            body=$(cat "$d/json")
            case "$body" in
              *tag_name*) echo "Accept honoured: got JSON" ;;
              *) echo "::error::HTTP_ACCEPT was not honoured; got a non-JSON body"; exit 1 ;;
            esac
            rm -rf "$d"

            # And through normal dispatch, which here means curl.
            echo "== github_release through dispatch =="
            tag=$(github_release client9/shlib) || {
              echo "::error::github_release failed"
              exit 1
            }
            echo "github_release -> $tag"

            # Run the suite directly rather than through make: the Makefile is
            # GNU-only (.DEFAULT_GOAL, MAKEFILE_LIST) and gmake is not in base.
            err=0
            for t in *_test.sh; do
              if sh "$t"; then :; else err=1; fi
            done
            exit $err
