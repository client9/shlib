name: python

on:
  push:
    branches: [master]
  pull_request:
  # this repo goes quiet for long stretches; a monthly build catches bit-rot
  # in the things we do not control (release URLs, runner images)
  schedule:
    - cron: '23 13 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: python3 as the only downloader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # run under docker rather than `container:` -- actions/checkout needs a
      # normal runner image
      - name: make test
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.12-slim sh -c '
            set -e
            apt-get update -qq && apt-get install -y -qq make

            # Assert the absence, the way the freebsd/openbsd/netbsd legs do.
            # Here the absence IS the thing under test: if a dependency ever
            # pulls curl in, the whole suite quietly stops exercising the
            # python branch and nothing goes red.  Note this deliberately
            # installs make and nothing else.
            for t in curl wget fetch ftp; do
              if command -v $t >/dev/null 2>&1; then
                echo "$t is present; this leg no longer tests the python3 branch" >&2
                exit 1
              fi
            done
            python3 --version

            make test TEST_SHELL=/bin/sh'

      # the suite proves the branch; this proves the product.  Same shape as
      # the omnios leg, which installs hugo and runs it.
      - name: install a real binary with no downloader present
        run: |
          docker run --rm -v "$PWD:/src" -w /tmp python:3.12-slim sh -c '
            set -e
            cat /src/install/examples/gosec.sh /src/dist/install-base.sh > install.sh
            # no tag, so this also exercises github_release resolving "latest",
            # which needs an Accept header -- the one thing fetch(1) and ftp(1)
            # cannot send, and the reason this branch is more than a fallback
            sh install.sh -b /tmp/bin
            /tmp/bin/gosec --version'
